[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-first-party-measurement-gateway"
version = "0.1.0"
description = "Consent-aware, test-mode e-commerce measurement gateway"
requires-python = ">=3.10"
authors = [{name = "Syed Muslim Shah"}]
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
